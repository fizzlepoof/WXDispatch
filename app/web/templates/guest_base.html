<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WXDispatch Guest View</title>
  <script>
    (function(){
      var saved;
      try{saved=localStorage.getItem("wxdispatch-theme");}catch(e){}
      var theme=(saved==="light"||saved==="dark")
        ? saved
        : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme=theme;
    })();
  </script>
  <style>
    :root{--bg:#eef1f7;--card:#fff;--ink:#1b2338;--muted:#78849c;--line:#e7ebf3;--accent:#4b63e6;--inset:#f5f7fc;--panel:#fff;--shadow:0 1px 2px rgba(16,24,48,.05),0 12px 30px rgba(16,24,48,.06);color-scheme:light}
    :root[data-theme="dark"]{--bg:#0d1220;--card:#161d2e;--ink:#e8edf7;--muted:#9da9bf;--line:#2b354a;--accent:#91a4ff;--inset:#111827;--panel:#161d2e;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.24);color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:var(--accent)}
    .guest-header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px max(20px,calc((100vw - 1320px)/2));background:linear-gradient(150deg,#242c5a,#33306b 55%,#3a2f74);color:#fff}
    .guest-brand{font-size:1.25rem;font-weight:800}.guest-brand small{display:block;color:#b7c0e3;font-size:.72rem;font-weight:500;letter-spacing:.05em;text-transform:uppercase}
    main{max-width:1320px;margin:auto;padding:24px 20px 40px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}.topbar .pt{margin:0;font-size:22px}.topbar .sub{margin:3px 0 0;color:var(--muted);font-size:13.5px}.hint{color:var(--muted);font-size:13px}.health-banner{border-radius:12px;padding:13px 16px;margin-bottom:16px;border:1px solid}.health-banner.warn{background:rgba(245,165,36,.12);border-color:rgba(245,165,36,.5)}
    .theme-toggle{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:8px 12px;cursor:pointer;font:inherit;font-weight:600}.guest-version{color:#b7c0e3;font-size:.78rem;margin-left:8px}
    :root[data-theme="dark"] .leaflet-control-zoom a{background:var(--card);color:var(--ink);border-bottom-color:var(--line)}:root[data-theme="dark"] .leaflet-control-attribution{background:rgba(22,29,46,.96);color:var(--ink)}:root[data-theme="dark"] .dark-map-labels{filter:brightness(1.45) contrast(1.15)}:root[data-theme="dark"] .leaflet-popup-content-wrapper,:root[data-theme="dark"] .leaflet-popup-tip{background:var(--card);color:var(--ink)}
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="guest-header"><div class="guest-brand">WXDispatch<small>Guest alert view</small></div><div><button class="theme-toggle" id="theme-toggle" type="button">Switch theme</button><span class="guest-version">v{{ version }}</span></div></header>
  <main>{% block content %}{% endblock %}</main>
  <script>
    (function(){var toggle=document.getElementById('theme-toggle');toggle.addEventListener('click',function(){var theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('wxdispatch-theme',theme)}catch(e){}window.dispatchEvent(new CustomEvent('wxdispatch:themechange',{detail:{theme:theme}}))})})();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
