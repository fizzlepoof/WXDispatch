[project]
name = "wxdispatch"
version = "2.3.0"
description = "Route county-aware NWS and IPAWS alerts over Meshtastic and MeshCore radios"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BrokenSignal" }]
maintainers = [{ name = "fizzlepoof" }]
keywords = ["meshtastic", "meshcore", "nws", "weather", "alerts", "emergency", "lora"]

[project.urls]
Homepage = "https://github.com/fizzlepoof/WXDispatch"
Repository = "https://github.com/fizzlepoof/WXDispatch"
Issues = "https://github.com/fizzlepoof/WXDispatch/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.setuptools]
packages = ["app", "app.web"]

[tool.setuptools.package-data]
"app.web" = ["templates/*.html"]
